name: CI

on:
  pull_request:
  # Not `push: main`. On `main` the gate is run by `deploy.yml`, which calls
  # this workflow and only publishes if it passes — so a push to `main` still
  # runs the full gate exactly once, and the thing that gets deployed is the
  # thing that passed.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
